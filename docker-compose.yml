services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: codemaster
      POSTGRES_PASSWORD: codemaster
      POSTGRES_DB: codemaster
    ports: ["5432:5432"]
    volumes: [codemaster_pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  codemaster_pg:
